<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>ARK 用量设置</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 22px;
      font-family: -apple-system, "PingFang SC", sans-serif;
      background: #fafafa;
      color: #1f2329;
      user-select: none;
    }
    h1 { font-size: 16px; margin: 0 0 18px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: #646a73; margin-bottom: 6px; }
    input, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d0d3d9;
      border-radius: 6px;
      font-size: 12px;
      font-family: ui-monospace, Menlo, monospace;
      background: #fff;
      outline: none;
    }
    input:focus, textarea:focus { border-color: #3370ff; }
    textarea { resize: vertical; }
    #usage {
      font-size: 13px;
      margin: 4px 0 16px;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid #e6e8eb;
      border-radius: 6px;
      color: #3370ff;
      font-weight: 600;
    }
    button {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      background: #3370ff;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:active { background: #275fe8; }
  </style>
</head>
<body>
  <h1>ARK 用量设置</h1>

  <div class="field">
    <label for="token">X_CSRF_TOKEN</label>
    <input id="token" type="text" spellcheck="false" autocomplete="off" />
  </div>

  <div class="field">
    <label for="webid">X_WEB_ID</label>
    <input id="webid" type="text" spellcheck="false" autocomplete="off" />
  </div>

  <div class="field">
    <label for="cookie">COOKIE</label>
    <textarea id="cookie" rows="5" spellcheck="false"></textarea>
  </div>

  <div id="usage">5小时 -- · 1周 -- · 1月 --</div>

  <button id="save">保存并开始刷新</button>

  <script src="renderer.js"></script>
</body>
</html>
